<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
    <defs>
        <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F46E5" />
            <stop offset="100%" stop-color="#00F5FF" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
            text { font-family: 'Inter', sans-serif; }
            .fill-anim {
                animation: fillBar 2s ease-out forwards;
            }
            @keyframes fillBar {
                0% { width: 0; }
            }
        </style>
    </defs>

    <text x="50" y="65" fill="#fff" font-size="18" font-weight="600">Python & Backend</text>
    <text x="1000" y="65" fill="#00F5FF" font-size="18" font-weight="600" text-anchor="end">90%</text>
    <!-- Background Bar -->
    <rect x="50" y="80" width="950" height="15" rx="7.5" fill="rgba(255,255,255,0.05)" />
    <!-- Filled Bar -->
    <rect x="50" y="80" width="855.0" height="15" rx="7.5" fill="url(#bar-grad)" filter="url(#glow)" class="fill-anim" />

    <text x="50" y="145" fill="#fff" font-size="18" font-weight="600">Machine Learning</text>
    <text x="1000" y="145" fill="#00F5FF" font-size="18" font-weight="600" text-anchor="end">85%</text>
    <!-- Background Bar -->
    <rect x="50" y="160" width="950" height="15" rx="7.5" fill="rgba(255,255,255,0.05)" />
    <!-- Filled Bar -->
    <rect x="50" y="160" width="807.5" height="15" rx="7.5" fill="url(#bar-grad)" filter="url(#glow)" class="fill-anim" />

    <text x="50" y="225" fill="#fff" font-size="18" font-weight="600">Cloud & DevOps</text>
    <text x="1000" y="225" fill="#00F5FF" font-size="18" font-weight="600" text-anchor="end">75%</text>
    <!-- Background Bar -->
    <rect x="50" y="240" width="950" height="15" rx="7.5" fill="rgba(255,255,255,0.05)" />
    <!-- Filled Bar -->
    <rect x="50" y="240" width="712.5" height="15" rx="7.5" fill="url(#bar-grad)" filter="url(#glow)" class="fill-anim" />

    <text x="50" y="305" fill="#fff" font-size="18" font-weight="600">React & Frontend</text>
    <text x="1000" y="305" fill="#00F5FF" font-size="18" font-weight="600" text-anchor="end">70%</text>
    <!-- Background Bar -->
    <rect x="50" y="320" width="950" height="15" rx="7.5" fill="rgba(255,255,255,0.05)" />
    <!-- Filled Bar -->
    <rect x="50" y="320" width="665.0" height="15" rx="7.5" fill="url(#bar-grad)" filter="url(#glow)" class="fill-anim" />
</svg>