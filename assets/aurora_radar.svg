    <text x="444.1" y="160.0" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">System Design</text>
    <text x="444.1" y="176.0" font-size="9" fill="#00F5FF" text-anchor="middle" class="mono">85%</text>
    <ellipse cx="600" cy="250" rx="210" ry="60" fill="none"
             stroke="rgba(129, 140, 248, 0.12)" stroke-width="1" stroke-dasharray="8 12"
             style="transform-origin: 600px 250px; animation: orbitCW 30s linear infinite;" />
    
