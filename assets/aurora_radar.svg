<polygon points="600.0,130.0 703.9,190.0 703.9,310.0 600.0,370.0 496.1,310.0 496.1,190.0" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" />
<polygon points="600.0,100.0 729.9,175.0 729.9,325.0 600.0,400.0 470.1,325.0 470.1,175.0" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" />
<line x1="600" y1="250" x2="600.0" y2="100.0" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />
<line x1="600" y1="250" x2="729.9" y2="175.0" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />
<line x1="600" y1="250" x2="729.9" y2="325.0" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />
<line x1="600" y1="250" x2="600.0" y2="400.0" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />
<line x1="600" y1="250" x2="470.1" y2="325.0" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />
<line x1="600" y1="250" x2="470.1" y2="175.0" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />

    <polygon points="600.0,107.5 714.3,184.0 706.5,311.5 600.0,370.0 498.7,308.5 489.6,186.2" fill="rgba(0, 245, 255, 0.08)" stroke="#00F5FF" stroke-width="2"
             style="animation: breathe 4s ease-in-out infinite;" filter="url(#soft-glow)" />
    <circle cx="600.0" cy="107.5" r="5" fill="#00F5FF" stroke="#FFF" stroke-width="1.5"
            style="animation: pulseNeon 3s ease-in-out 0.0s infinite; --glow-color: #00F5FF;" />
    <text x="600.0" y="70.0" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">AI/ML</text>
    <text x="600.0" y="86.0" font-size="9" fill="#00F5FF" text-anchor="middle" class="mono">95%</text>
