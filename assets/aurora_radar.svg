    <text x="600.0" y="430.0" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">DevOps</text>
    <text x="600.0" y="446.0" font-size="9" fill="#00F5FF" text-anchor="middle" class="mono">80%</text>
    <circle cx="498.7" cy="308.5" r="5" fill="#00F5FF" stroke="#FFF" stroke-width="1.5"
            style="animation: pulseNeon 3s ease-in-out 1.2s infinite; --glow-color: #00F5FF;" />
