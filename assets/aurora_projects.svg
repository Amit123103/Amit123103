<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
    <defs>
        <style>
            text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; fill: #FFFFFF; }
            .proj-card { fill: rgba(15, 23, 42, 0.7); stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; rx: 12; }
            .tag { fill: rgba(56, 189, 248, 0.1); stroke: rgba(56, 189, 248, 0.3); stroke-width: 1; rx: 8; }
        </style>
        
        <linearGradient id="proj-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(30, 41, 59, 0.5)" />
            <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)" />
        </linearGradient>
    </defs>
    
    <text x="600" y="38" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="2" fill="#38BDF8">FEATURED PROJECTS</text>
    <rect x="580" y="48" width="40" height="2" fill="#818CF8" />

    <g transform="translate(60, 80)">
        <rect x="0" y="0" width="320" height="240" fill="url(#proj-grad)" class="proj-card" />
        <rect x="0" y="0" width="320" height="3" fill="#38BDF8" rx="1.5" />
        
        <text x="20" y="40" font-size="16" font-weight="700" fill="#F8FAFC">AI Vision System</text>
        <text x="20" y="68" font-size="13" fill="#94A3B8">Real-time object tracking &amp; computer vision pipeline.</text>
        
        <!-- Tags -->
        <g transform="translate(20, 120)">
            <rect x="0" y="0" width="75" height="24" class="tag" />
            <text x="37" y="16" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">PyTorch</text>
            
            <rect x="85" y="0" width="75" height="24" class="tag" />
            <text x="122" y="16" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">OpenCV</text>
        </g>
        
        <!-- Action Button -->
        <g transform="translate(20, 175)">
            <rect x="0" y="0" width="280" height="36" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
            <text x="140" y="22" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">View Repository →</text>
        </g>
    </g>

    <g transform="translate(440, 80)">
        <rect x="0" y="0" width="320" height="240" fill="url(#proj-grad)" class="proj-card" />
        <rect x="0" y="0" width="320" height="3" fill="#38BDF8" rx="1.5" />
        
        <text x="20" y="40" font-size="16" font-weight="700" fill="#F8FAFC">Quantum RAG Engine</text>
        <text x="20" y="68" font-size="13" fill="#94A3B8">High-performance generative retrieval AI framework.</text>
        
        <!-- Tags -->
        <g transform="translate(20, 120)">
            <rect x="0" y="0" width="75" height="24" class="tag" />
            <text x="37" y="16" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">LangChain</text>
            
            <rect x="85" y="0" width="75" height="24" class="tag" />
            <text x="122" y="16" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">FastAPI</text>
        </g>
        
        <!-- Action Button -->
        <g transform="translate(20, 175)">
            <rect x="0" y="0" width="280" height="36" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
            <text x="140" y="22" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">View Repository →</text>
        </g>
    </g>

    <g transform="translate(820, 80)">
        <rect x="0" y="0" width="320" height="240" fill="url(#proj-grad)" class="proj-card" />
        <rect x="0" y="0" width="320" height="3" fill="#38BDF8" rx="1.5" />
        
        <text x="20" y="40" font-size="16" font-weight="700" fill="#F8FAFC">Cloud MLOps Pipeline</text>
        <text x="20" y="68" font-size="13" fill="#94A3B8">Automated deployment &amp; monitoring architecture.</text>
        
        <!-- Tags -->
        <g transform="translate(20, 120)">
            <rect x="0" y="0" width="75" height="24" class="tag" />
            <text x="37" y="16" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">AWS</text>
            
            <rect x="85" y="0" width="75" height="24" class="tag" />
            <text x="122" y="16" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">Docker</text>
        </g>
        
        <!-- Action Button -->
        <g transform="translate(20, 175)">
            <rect x="0" y="0" width="280" height="36" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
            <text x="140" y="22" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">View Repository →</text>
        </g>
    </g>
</svg>