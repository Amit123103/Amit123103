<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
    <defs>
        <style>
            @keyframes cardHover {
                0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 245, 255, 0.3)); transform: translateY(0px); }
                50% { filter: drop-shadow(0 0 18px rgba(0, 245, 255, 0.85)); transform: translateY(-5px); }
            }
            
            text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; fill: #FFFFFF; }
            .proj-3d { animation: cardHover 4s ease-in-out infinite alternate; }
        </style>
        
        <linearGradient id="proj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#050a18" />
            <stop offset="50%" stop-color="#090e22" />
            <stop offset="100%" stop-color="#030611" />
        </linearGradient>

        <linearGradient id="card-proj-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
            <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
        </linearGradient>
    </defs>
    
    <!-- 3D Deck Frame -->
    <rect width="100%" height="100%" fill="url(#proj-bg)" rx="16" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" />

    <text x="600" y="38" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="2.5" fill="#38BDF8">FEATURED PRODUCTION PROJECTS &amp; CORE ARCHITECTURE</text>
    <rect x="560" y="48" width="80" height="2" fill="#818CF8" rx="1" />

    <g transform="translate(60, 75)" class="proj-3d">
        <!-- 3D Drop Shadow Pedestal -->
        <rect x="4" y="6" width="320" height="270" rx="14" fill="rgba(0,0,0,0.6)" />
        
        <!-- Card Body -->
        <rect x="0" y="0" width="320" height="270" fill="url(#card-proj-grad)" stroke="#00F5FF" stroke-width="1.5" rx="14" />
        <rect x="0" y="0" width="320" height="4" fill="#00F5FF" rx="2" />
        
        <!-- Status Node -->
        <circle cx="26" cy="40" r="4" fill="#00F5FF" />
        <text x="40" y="45" font-size="18" font-weight="800" fill="#F8FAFC">MyKernel</text>
        <text x="26" y="78" font-size="13" fill="#94A3B8">High-performance OS kernel &amp; system architecture module.</text>
        
        <!-- Interactive Tech Tags -->
        <g transform="translate(26, 140)">

            <rect x="0" y="0" width="48" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="#00F5FF" stroke-width="1" />
            <text x="24.0" y="17" font-size="11" font-weight="700" fill="#00F5FF" text-anchor="middle">C++</text>

            <rect x="58" y="0" width="64" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="#00F5FF" stroke-width="1" />
            <text x="90.0" y="17" font-size="11" font-weight="700" fill="#00F5FF" text-anchor="middle">Linux</text>

            <rect x="132" y="0" width="72" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="#00F5FF" stroke-width="1" />
            <text x="168.0" y="17" font-size="11" font-weight="700" fill="#00F5FF" text-anchor="middle">x86_64</text>

        </g>
        
        <!-- Action Button with 3D Bevel -->
        <g transform="translate(26, 205)">
            <rect x="2" y="3" width="268" height="42" rx="8" fill="rgba(0,0,0,0.4)" />
            <rect x="0" y="0" width="268" height="42" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#00F5FF" stroke-width="1.2" />
            <text x="134" y="26" font-size="13" font-weight="800" fill="#00F5FF" text-anchor="middle">View Repository ⚡ →</text>
        </g>
    </g>

    <g transform="translate(440, 75)" class="proj-3d">
        <!-- 3D Drop Shadow Pedestal -->
        <rect x="4" y="6" width="320" height="270" rx="14" fill="rgba(0,0,0,0.6)" />
        
        <!-- Card Body -->
        <rect x="0" y="0" width="320" height="270" fill="url(#card-proj-grad)" stroke="#818CF8" stroke-width="1.5" rx="14" />
        <rect x="0" y="0" width="320" height="4" fill="#818CF8" rx="2" />
        
        <!-- Status Node -->
        <circle cx="26" cy="40" r="4" fill="#818CF8" />
        <text x="40" y="45" font-size="18" font-weight="800" fill="#F8FAFC">AI-HUMANIZER-PRO</text>
        <text x="26" y="78" font-size="13" fill="#94A3B8">Next-gen LLM generative AI &amp; text humanization engine.</text>
        
        <!-- Interactive Tech Tags -->
        <g transform="translate(26, 140)">

            <rect x="0" y="0" width="72" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="#818CF8" stroke-width="1" />
            <text x="36.0" y="17" font-size="11" font-weight="700" fill="#818CF8" text-anchor="middle">Python</text>

            <rect x="82" y="0" width="80" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="#818CF8" stroke-width="1" />
            <text x="122.0" y="17" font-size="11" font-weight="700" fill="#818CF8" text-anchor="middle">FastAPI</text>

            <rect x="172" y="0" width="56" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="#818CF8" stroke-width="1" />
            <text x="200.0" y="17" font-size="11" font-weight="700" fill="#818CF8" text-anchor="middle">LLMs</text>

        </g>
        
        <!-- Action Button with 3D Bevel -->
        <g transform="translate(26, 205)">
            <rect x="2" y="3" width="268" height="42" rx="8" fill="rgba(0,0,0,0.4)" />
            <rect x="0" y="0" width="268" height="42" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#818CF8" stroke-width="1.2" />
            <text x="134" y="26" font-size="13" font-weight="800" fill="#818CF8" text-anchor="middle">View Repository ⚡ →</text>
        </g>
    </g>

    <g transform="translate(820, 75)" class="proj-3d">
        <!-- 3D Drop Shadow Pedestal -->
        <rect x="4" y="6" width="320" height="270" rx="14" fill="rgba(0,0,0,0.6)" />
        
        <!-- Card Body -->
        <rect x="0" y="0" width="320" height="270" fill="url(#card-proj-grad)" stroke="#C084FC" stroke-width="1.5" rx="14" />
        <rect x="0" y="0" width="320" height="4" fill="#C084FC" rx="2" />
        
        <!-- Status Node -->
        <circle cx="26" cy="40" r="4" fill="#C084FC" />
        <text x="40" y="45" font-size="18" font-weight="800" fill="#F8FAFC">AI-Interviewer</text>
        <text x="26" y="78" font-size="13" fill="#94A3B8">Agentic AI automated evaluation &amp; interview simulator.</text>
        
        <!-- Interactive Tech Tags -->
        <g transform="translate(26, 140)">

            <rect x="0" y="0" width="64" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="#C084FC" stroke-width="1" />
            <text x="32.0" y="17" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">React</text>

            <rect x="74" y="0" width="104" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="#C084FC" stroke-width="1" />
            <text x="126.0" y="17" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">Agentic AI</text>

            <rect x="188" y="0" width="80" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="#C084FC" stroke-width="1" />
            <text x="228.0" y="17" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">Next.js</text>

        </g>
        
        <!-- Action Button with 3D Bevel -->
        <g transform="translate(26, 205)">
            <rect x="2" y="3" width="268" height="42" rx="8" fill="rgba(0,0,0,0.4)" />
            <rect x="0" y="0" width="268" height="42" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#C084FC" stroke-width="1.2" />
            <text x="134" y="26" font-size="13" font-weight="800" fill="#C084FC" text-anchor="middle">View Repository ⚡ →</text>
        </g>
    </g>
</svg>