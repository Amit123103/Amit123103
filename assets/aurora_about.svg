<line x1="864" y1="61" x2="910" y2="144" stroke="#00F5FF" stroke-width="0.5" opacity="0.042" />
<line x1="591" y1="43" x2="782" y2="81" stroke="#00F5FF" stroke-width="0.5" opacity="0.002" />
<line x1="910" y1="144" x2="782" y2="81" stroke="#00F5FF" stroke-width="0.5" opacity="0.023" />
<line x1="910" y1="144" x2="986" y2="141" stroke="#00F5FF" stroke-width="0.5" opacity="0.05" />
<line x1="986" y1="141" x2="987" y2="66" stroke="#00F5FF" stroke-width="0.5" opacity="0.05" />


    
    <text x="600" y="38" font-size="22" font-weight="800" fill="#F1F5F9" letter-spacing="3" text-anchor="middle">CORE FOCUS &amp; CAPABILITIES</text>
