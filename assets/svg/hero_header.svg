<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Glowing Indigo to Cyan Accent Mesh -->
    <linearGradient id="indigo-cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <radialGradient id="aurora-core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glass-border-luxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Gaussian Blur Filters -->
    <filter id="hyper-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#06B6D4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <!-- Fine Scanlines -->
    <pattern id="scanline-pattern" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes ring-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse-core { 0%, 100% { transform: scale(0.98); opacity: 0.7; } 50% { transform: scale(1.03); opacity: 1; } }
    @keyframes star-meteor { 0% { transform: translate(0, 0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(-320px, 320px); opacity: 0; } }
    @keyframes blink-cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .ring-rotate { transform-origin: 600px 230px; animation: ring-spin 30s linear infinite; }
    .pulse-layer { transform-origin: 600px 230px; animation: pulse-core 6s ease-in-out infinite; }
    .meteor-a { animation: star-meteor 5s linear infinite; animation-delay: 0.2s; }
    .meteor-b { animation: star-meteor 7s linear infinite; animation-delay: 2.5s; }
    .cursor-glow { animation: blink-cursor 1s infinite; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="460" rx="20" fill="url(#hero-bg)"/>
  <rect width="1200" height="460" rx="20" fill="url(#grid-pattern)"/>
  <circle cx="600" cy="230" r="380" fill="url(#aurora-core)"/>

  <!-- Meteors -->
  <g opacity="0.65">
    <line class="meteor-a" x1="1050" y1="30" x2="1200" y2="-120" stroke="url(#indigo-cyan-glow)" stroke-width="2" stroke-linecap="round"/>
    <line class="meteor-b" x1="780" y1="15" x2="930" y2="-135" stroke="#10B981" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Animated Glowing Hologram Rings -->
  <g class="pulse-layer">
    <circle cx="600" cy="230" r="190" fill="none" stroke="url(#indigo-cyan-glow)" stroke-width="1.5" stroke-opacity="0.35" filter="url(#subtle-blur)"/>
  </g>
  <g class="ring-rotate">
    <circle cx="600" cy="230" r="210" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="25 12 6 12" stroke-opacity="0.5" filter="url(#subtle-blur)"/>
    <circle cx="600" cy="230" r="155" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="45 18 12 18" stroke-opacity="0.6"/>
  </g>

  <!-- Liquid Glass Panel Frame -->
  <rect x="35" y="35" width="1130" height="390" rx="18" fill="#0B0F19" fill-opacity="0.5" stroke="url(#glass-border-luxury)" stroke-width="1.5" filter="url(#subtle-blur)"/>

  <!-- Top Cyberpunk OS Status Header -->
  <g class="font-mono" font-size="12" fill="#9CA3AF">
    <circle cx="65" cy="68" r="5" fill="#10B981" filter="url(#subtle-blur)"/>
    <text x="80" y="72" fill="#10B981" font-weight="700">MYKERNEL v1.0 ONLINE</text>
    <text x="240" y="72" opacity="0.4">|</text>
    <text x="260" y="72" fill="#F9FAFB" opacity="0.9">ARCH :: 64-BIT x86_64 MULTIBOOT2</text>
    <text x="940" y="72" fill="#06B6D4" opacity="0.95" text-anchor="end">FINAL YEAR CSE [IN]</text>
    <text x="1130" y="72" fill="#4F46E5" font-weight="700" text-anchor="end">KERNEL -&gt; CLOUD</text>
    <line x1="55" y1="88" x2="1145" y2="88" stroke="#06B6D4" stroke-opacity="0.18" stroke-dasharray="8 4"/>
  </g>

  <!-- Hero Main Title & Tagline -->
  <g text-anchor="middle">
    <!-- Role Badge Pill -->
    <rect x="370" y="115" width="460" height="36" rx="18" fill="#111827" fill-opacity="0.9" stroke="#06B6D4" stroke-opacity="0.6"/>
    <text x="600" y="138" class="font-mono" font-size="13" fill="#10B981" font-weight="700" letter-spacing="2">
      ⚡ CREATOR OF MYKERNEL (64-BIT x86_64 OS)
    </text>

    <!-- Main Title: AMIT AKHIL -->
    <text x="600" y="230" class="font-sans" font-size="72" font-weight="900" fill="url(#indigo-cyan-glow)" filter="url(#hyper-glow)" letter-spacing="4">
      AMIT AKHIL
    </text>

    <!-- Animated Typing Tagline -->
    <g class="font-mono" font-size="18" fill="#F9FAFB">
      <text x="600" y="282" opacity="0.95">
        &gt; Building systems from the kernel to the cloud.<tspan class="cursor-glow" fill="#10B981">_</tspan>
      </text>
    </g>

    <!-- Feature Pills -->
    <g class="font-mono" font-size="12" transform="translate(0, 335)">
      <!-- Pill 1 -->
      <g transform="translate(310, 0)">
        <rect x="0" y="0" width="180" height="36" rx="18" fill="#111827" fill-opacity="0.9" stroke="#06B6D4" stroke-opacity="0.6"/>
        <text x="90" y="22" fill="#06B6D4" font-weight="700">⚙️ OS &amp; Kernel Dev</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(510, 0)">
        <rect x="0" y="0" width="180" height="36" rx="18" fill="#111827" fill-opacity="0.9" stroke="#4F46E5" stroke-opacity="0.6"/>
        <text x="90" y="22" fill="#4F46E5" font-weight="700">🚀 MLOps &amp; DevOps</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(710, 0)">
        <rect x="0" y="0" width="180" height="36" rx="18" fill="#111827" fill-opacity="0.9" stroke="#10B981" stroke-opacity="0.6"/>
        <text x="90" y="22" fill="#10B981" font-weight="700">🔗 Blockchain &amp; Cloud</text>
      </g>
    </g>
  </g>

  <!-- CRT Scanline Overlay -->
  <rect width="1200" height="460" rx="20" fill="url(#scanline-pattern)" pointer-events="none"/>
</svg>
