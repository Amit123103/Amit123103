<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Cyberpunk Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cyan-purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#6A5CFF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>

    <linearGradient id="neon-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Glassmorphism Shimmer & Border -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6A5CFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0.7"/>
    </linearGradient>

    <radialGradient id="glow-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6A5CFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for 3D Neon Glow & Glass Blur -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F5FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.4; }
      50% { transform: scale(1.05); opacity: 0.9; }
      100% { transform: scale(0.95); opacity: 0.4; }
    }
    @keyframes rotate-ring {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes meteor-slide {
      0% { transform: translate(0, 0); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translate(-300px, 300px); opacity: 0; }
    }
    @keyframes text-shimmer {
      0% { stop-color: #00F5FF; }
      50% { stop-color: #00FFA3; }
      100% { stop-color: #8A2BE2; }
    }
    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes grid-move {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }
    .ring-anim { transform-origin: 600px 210px; animation: rotate-ring 25s linear infinite; }
    .pulse-anim { transform-origin: 600px 210px; animation: pulse-ring 6s ease-in-out infinite; }
    .meteor-1 { animation: meteor-slide 4s linear infinite; animation-delay: 0.5s; }
    .meteor-2 { animation: meteor-slide 6s linear infinite; animation-delay: 2.2s; }
    .meteor-3 { animation: meteor-slide 5s linear infinite; animation-delay: 3.8s; }
    .blink-cursor { animation: cursor-blink 1s infinite; }
    .title-text { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 900; letter-spacing: 4px; }
    .mono-text { font-family: 'Consolas', 'Fira Code', Monaco, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>

  <!-- Perspective 3D Grid -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Radial Core Glow -->
  <circle cx="600" cy="210" r="350" fill="url(#glow-core)"/>

  <!-- Meteors / Shooting Stars -->
  <g opacity="0.6">
    <line class="meteor-1" x1="1000" y1="20" x2="1150" y2="-130" stroke="url(#cyan-purple-grad)" stroke-width="2" stroke-linecap="round"/>
    <line class="meteor-2" x1="750" y1="10" x2="900" y2="-140" stroke="url(#neon-green-grad)" stroke-width="2" stroke-linecap="round"/>
    <line class="meteor-3" x1="400" y1="30" x2="550" y2="-120" stroke="url(#cyan-purple-grad)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Animated Glowing Hologram Rings -->
  <g class="pulse-anim">
    <circle cx="600" cy="210" r="170" fill="none" stroke="url(#cyan-purple-grad)" stroke-width="1.5" stroke-opacity="0.3" filter="url(#subtle-glow)"/>
  </g>
  <g class="ring-anim">
    <circle cx="600" cy="210" r="190" fill="none" stroke="#00F5FF" stroke-width="1" stroke-dasharray="20 10 5 10" stroke-opacity="0.5" filter="url(#subtle-glow)"/>
    <circle cx="600" cy="210" r="140" fill="none" stroke="#8A2BE2" stroke-width="1.5" stroke-dasharray="40 15 10 15" stroke-opacity="0.6"/>
  </g>

  <!-- Glassmorphism Container Frame -->
  <rect x="30" y="30" width="1140" height="360" rx="16" fill="#0B1020" fill-opacity="0.45" stroke="url(#glass-border)" stroke-width="1.5" filter="url(#subtle-glow)"/>

  <!-- Top Cyberpunk OS Status Bar -->
  <g class="mono-text" font-size="12" fill="#7DF9FF">
    <!-- Status Indicator LED -->
    <circle cx="60" cy="60" r="5" fill="#00FFA3" filter="url(#subtle-glow)"/>
    <text x="75" y="64" fill="#00FFA3" font-weight="bold">SYSTEM ONLINE</text>
    <text x="210" y="64" opacity="0.6">|</text>
    <text x="230" y="64" fill="#7DF9FF" opacity="0.8">AI OS NODE :: v4.0.2</text>
    <text x="960" y="64" fill="#00F5FF" opacity="0.9" text-anchor="end">LOC: INDIA [IN]</text>
    <text x="1140" y="64" fill="#6A5CFF" font-weight="bold" text-anchor="end">PORT :: 8080 [SECURE]</text>
    <line x1="50" y1="80" x2="1150" y2="80" stroke="#00F5FF" stroke-opacity="0.2" stroke-dasharray="8 4"/>
  </g>

  <!-- Main Hero Title -->
  <g text-anchor="middle">
    <!-- Subtitle Badge -->
    <rect x="420" y="105" width="360" height="32" rx="16" fill="#111827" fill-opacity="0.8" stroke="#00F5FF" stroke-opacity="0.5"/>
    <text x="600" y="126" class="mono-text" font-size="13" fill="#00FFA3" font-weight="bold" letter-spacing="2">
      ⚡ MACHINE LEARNING &amp; FULL STACK ENGINEER
    </text>

    <!-- Glowing Main Name Title -->
    <text x="600" y="210" class="title-text" font-size="64" fill="url(#cyan-purple-grad)" filter="url(#neon-glow)">
      AMIT AKHIL
    </text>

    <!-- Typing Interactive Tagline -->
    <g class="mono-text" font-size="18" fill="#7DF9FF">
      <text x="600" y="260" opacity="0.9">
        &gt; Building Intelligent Systems &amp; Next-Gen Interactive Web Apps<tspan class="blink-cursor" fill="#00FFA3">_</tspan>
      </text>
    </g>

    <!-- Feature Pills -->
    <g class="mono-text" font-size="12" transform="translate(0, 310)">
      <!-- Pill 1: Computer Vision -->
      <g transform="translate(340, 0)">
        <rect x="0" y="0" width="160" height="34" rx="17" fill="#111827" fill-opacity="0.9" stroke="#00F5FF" stroke-opacity="0.6"/>
        <text x="80" y="21" fill="#00F5FF" font-weight="bold">🧠 Deep Learning</text>
      </g>
      <!-- Pill 2: Full-Stack AI -->
      <g transform="translate(520, 0)">
        <rect x="0" y="0" width="160" height="34" rx="17" fill="#111827" fill-opacity="0.9" stroke="#6A5CFF" stroke-opacity="0.6"/>
        <text x="80" y="21" fill="#6A5CFF" font-weight="bold">⚡ Computer Vision</text>
      </g>
      <!-- Pill 3: Cloud & Systems -->
      <g transform="translate(700, 0)">
        <rect x="0" y="0" width="160" height="34" rx="17" fill="#111827" fill-opacity="0.9" stroke="#00FFA3" stroke-opacity="0.6"/>
        <text x="80" y="21" fill="#00FFA3" font-weight="bold">🚀 Cloud &amp; DevOps</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Corner Decorations -->
  <path d="M 40 370 L 40 380 L 50 380" stroke="#00F5FF" stroke-width="2" fill="none"/>
  <path d="M 1160 370 L 1160 380 L 1150 380" stroke="#00F5FF" stroke-width="2" fill="none"/>
  <path d="M 40 50 L 40 40 L 50 40" stroke="#00F5FF" stroke-width="2" fill="none"/>
  <path d="M 1160 50 L 1160 40 L 1150 40" stroke="#00F5FF" stroke-width="2" fill="none"/>
</svg>
