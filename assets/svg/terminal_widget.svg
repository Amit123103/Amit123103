<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="term-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes cursor-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 13px; }
    .blink { animation: cursor-blink 1s infinite; }
  </style>

  <!-- Window Frame -->
  <rect x="5" y="5" width="940" height="350" rx="12" fill="url(#term-bg)" stroke="url(#term-border)" stroke-width="1.5" filter="url(#term-glow)"/>

  <!-- Window Header Bar -->
  <rect x="5" y="5" width="940" height="36" rx="12" fill="#111827"/>
  <circle cx="30" cy="23" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="23" r="6" fill="#FFBD2E"/>
  <circle cx="70" cy="23" r="6" fill="#27C93F"/>

  <!-- Title Text -->
  <text x="475" y="27" class="mono" font-size="12" font-weight="bold" fill="#7DF9FF" text-anchor="middle">
    bash - amit@mykernel-x86_64: ~/os_kernel/build
  </text>

  <!-- Terminal Content Lines -->
  <g class="mono" transform="translate(30, 70)">
    <!-- Line 1 -->
    <text x="0" y="0" fill="#10B981" font-weight="bold">amit@mykernel:~$</text>
    <text x="145" y="0" fill="#ffffff"> ./boot_mykernel.sh --arch=x86_64 --multiboot2 --vfs=fat32</text>

    <!-- Line 2 -->
    <text x="0" y="25" fill="#06B6D4">[KERNEL]</text>
    <text x="75" y="25" fill="#ffffff"> Initializing 64-bit Long Mode | NASM Assembly + C Kernel Core</text>

    <!-- Line 3 -->
    <text x="0" y="50" fill="#06B6D4">[MMU]</text>
    <text x="75" y="50" fill="#ffffff"> Paging Enabled: Virtual Memory, Physical Allocator &amp; Kernel Heap Ready</text>

    <!-- Line 4 -->
    <text x="0" y="75" fill="#06B6D4">[VFS/IPC]</text>
    <text x="85" y="75" fill="#ffffff"> Mounted FAT32 Virtual File System | IPC Channels &amp; Scheduler Active</text>

    <!-- Line 5 -->
    <text x="0" y="100" fill="#10B981">[NETSTACK]</text>
    <text x="95" y="100" fill="#10B981" font-weight="bold"> Ethernet, ARP, IPv4, ICMP, UDP, TCP &amp; DHCP stack bound to port 80</text>

    <!-- Line 6 -->
    <text x="0" y="125" fill="#4F46E5">[MLOPS/DEVOPS]</text>
    <text x="130" y="125" fill="#ffffff"> Docker + K8s cluster sync: Containerized AI model pipelines active</text>

    <!-- Line 7 -->
    <text x="0" y="150" fill="#10B981">[SUCCESS]</text>
    <text x="95" y="150" fill="#06B6D4"> MyKernel 64-bit OS running seamlessly from low-level to cloud!</text>

    <!-- Prompt Line -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" fill="#10B981" font-weight="bold">amit@mykernel:~$</text>
      <text x="145" y="0" fill="#ffffff"> deploy_next_systems_pipeline.py</text>
      <rect class="blink" x="420" y="-12" width="9" height="15" fill="#06B6D4"/>
    </g>
  </g>
</svg>
