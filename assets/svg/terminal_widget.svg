<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0F1424" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9D00FF" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="term-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes cursor-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 13px; }
    .blink { animation: cursor-blink 1s infinite; }
  </style>

  <!-- Frame -->
  <rect x="5" y="5" width="940" height="350" rx="12" fill="url(#term-bg)" stroke="url(#term-border)" stroke-width="1.5" filter="url(#term-glow)"/>

  <!-- Header Bar -->
  <rect x="5" y="5" width="940" height="36" rx="12" fill="#161B33"/>
  <circle cx="30" cy="23" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="23" r="6" fill="#FFBD2E"/>
  <circle cx="70" cy="23" r="6" fill="#27C93F"/>

  <text x="475" y="27" class="mono" font-size="12" font-weight="bold" fill="#00FF9D" text-anchor="middle">
    quantum-kernel@amit-node-01: ~/mykernel/build
  </text>

  <!-- Terminal Content Lines -->
  <g class="mono" transform="translate(30, 70)">
    <text x="0" y="0" fill="#00FF9D" font-weight="bold">amit@quantum-node:~$</text>
    <text x="180" y="0" fill="#ffffff"> ./boot_mykernel.sh --arch=x86_64 --multiboot2 --vfs=fat32</text>

    <text x="0" y="25" fill="#00E5FF">[MYKERNEL]</text>
    <text x="85" y="25" fill="#ffffff"> Booting 64-Bit Long Mode | C Core + NASM Assembly Interfacing</text>

    <text x="0" y="50" fill="#00E5FF">[PAGING]</text>
    <text x="75" y="50" fill="#ffffff"> Virtual Memory 4-Level Paging Enabled | Physical Page Allocator Ready</text>

    <text x="0" y="75" fill="#00E5FF">[VFS/IPC]</text>
    <text x="85" y="75" fill="#ffffff"> FAT32 Virtual File System Mounted | IPC Sockets &amp; Task Scheduler Active</text>

    <text x="0" y="100" fill="#00FF9D">[NETSTACK]</text>
    <text x="95" y="100" fill="#00FF9D" font-weight="bold"> Ethernet, ARP, IPv4, ICMP, UDP, TCP &amp; DHCP stack online on port 80</text>

    <text x="0" y="125" fill="#9D00FF">[MLOPS/DEVOPS]</text>
    <text x="135" y="125" fill="#ffffff"> Docker + K8s cluster sync: Containerized AI model pipelines active</text>

    <text x="0" y="150" fill="#00FF9D">[SUCCESS]</text>
    <text x="95" y="150" fill="#00E5FF"> MyKernel 64-bit OS running seamlessly from low-level to cloud!</text>

    <g transform="translate(0, 185)">
      <text x="0" y="0" fill="#00FF9D" font-weight="bold">amit@quantum-node:~$</text>
      <text x="180" y="0" fill="#ffffff"> execute_systems_pipeline.py</text>
      <rect class="blink" x="420" y="-12" width="9" height="15" fill="#00FF9D"/>
    </g>
  </g>
</svg>
