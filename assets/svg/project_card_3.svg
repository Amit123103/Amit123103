<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1424" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0D14" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="cyan-violet-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#9D00FF"/>
    </linearGradient>

    <filter id="glow-3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect x="5" y="5" width="590" height="310" rx="16" fill="url(#card-bg-3)" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.5" filter="url(#glow-3)"/>

  <rect x="5" y="5" width="590" height="40" rx="16" fill="#161B33"/>
  <text x="25" y="30" class="mono" font-size="12" font-weight="bold" fill="#00E5FF">&gt; PROJECT // 03</text>
  <rect x="440" y="15" width="135" height="22" rx="11" fill="#0A0D14" stroke="#00E5FF" stroke-opacity="0.5"/>
  <text x="507" y="30" class="mono" font-size="10" fill="#00E5FF" text-anchor="middle">COMPUTER VISION</text>

  <g transform="translate(25, 75)">
    <text x="0" y="0" class="sans" font-size="22" font-weight="900" fill="#ffffff">🖐️ Gesture Air-Canvas &amp; Emotion AI</text>
    
    <text x="0" y="30" class="sans" font-size="13" fill="#F8FAFC" opacity="0.95">
      Real-time 3D hand tracking air-canvas and facial expression recognition
    </text>
    <text x="0" y="50" class="sans" font-size="13" fill="#F8FAFC" opacity="0.95">
      engine integrated with OpenCV, PyTorch, MediaPipe &amp; React.
    </text>

    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="80" height="24" rx="6" fill="#161B33" stroke="#00E5FF" stroke-opacity="0.4"/>
      <text x="40" y="16" class="mono" font-size="11" fill="#00E5FF" text-anchor="middle">OpenCV</text>

      <rect x="90" y="0" width="85" height="24" rx="6" fill="#161B33" stroke="#00FF9D" stroke-opacity="0.4"/>
      <text x="132" y="16" class="mono" font-size="11" fill="#00FF9D" text-anchor="middle">MediaPipe</text>

      <rect x="185" y="0" width="80" height="24" rx="6" fill="#161B33" stroke="#9D00FF" stroke-opacity="0.4"/>
      <text x="225" y="16" class="mono" font-size="11" fill="#9D00FF" text-anchor="middle">PyTorch</text>

      <rect x="275" y="0" width="75" height="24" rx="6" fill="#161B33" stroke="#FFD700" stroke-opacity="0.4"/>
      <text x="312" y="16" class="mono" font-size="11" fill="#FFD700" text-anchor="middle">React.js</text>
    </g>

    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="160" height="38" rx="8" fill="url(#cyan-violet-3)" filter="url(#glow-3)"/>
      <text x="80" y="24" class="sans" font-size="13" font-weight="bold" fill="#0A0D14" text-anchor="middle">⚡ VIEW SOURCE</text>

      <rect x="180" y="0" width="160" height="38" rx="8" fill="#161B33" stroke="#00FF9D" stroke-width="1"/>
      <text x="260" y="24" class="sans" font-size="13" font-weight="bold" fill="#00FF9D" text-anchor="middle">🚀 DEMO</text>
    </g>
  </g>
</svg>
