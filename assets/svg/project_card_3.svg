<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="cyan-green-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <filter id="glow-3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Consolas', 'Fira Code', monospace; }
    .sans { font-family: 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Outer Glass Frame -->
  <rect x="5" y="5" width="590" height="310" rx="16" fill="url(#card-bg-3)" stroke="#00FFA3" stroke-opacity="0.5" stroke-width="1.5" filter="url(#glow-3)"/>

  <!-- Card Top Banner -->
  <rect x="5" y="5" width="590" height="40" rx="16" fill="#111827"/>
  <text x="25" y="30" class="mono" font-size="12" font-weight="bold" fill="#00FFA3">&gt; PROJECT // 03</text>
  <rect x="450" y="15" width="125" height="22" rx="11" fill="#050816" stroke="#00FFA3" stroke-opacity="0.4"/>
  <text x="512" y="30" class="mono" font-size="10" fill="#00FFA3" text-anchor="middle">LLMS &amp; AUTOMATION</text>

  <!-- Title & Description -->
  <g transform="translate(25, 75)">
    <text x="0" y="0" class="sans" font-size="22" font-weight="900" fill="#ffffff">🤖 AI Task Automation &amp; LLM Pipeline</text>
    
    <text x="0" y="30" class="sans" font-size="13" fill="#7DF9FF" opacity="0.9">
      Smart RAG-powered workflow automation system connecting vector databases
    </text>
    <text x="0" y="50" class="sans" font-size="13" fill="#7DF9FF" opacity="0.9">
      and LLMs with autonomous agentic execution scripts.
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="85" height="24" rx="6" fill="#111827" stroke="#00FFA3" stroke-opacity="0.3"/>
      <text x="42" y="16" class="mono" font-size="11" fill="#00FFA3" text-anchor="middle">LangChain</text>

      <rect x="95" y="0" width="80" height="24" rx="6" fill="#111827" stroke="#00F5FF" stroke-opacity="0.3"/>
      <text x="135" y="16" class="mono" font-size="11" fill="#00F5FF" text-anchor="middle">FastAPI</text>

      <rect x="185" y="0" width="85" height="24" rx="6" fill="#111827" stroke="#6A5CFF" stroke-opacity="0.3"/>
      <text x="227" y="16" class="mono" font-size="11" fill="#6A5CFF" text-anchor="middle">ChromaDB</text>

      <rect x="280" y="0" width="75" height="24" rx="6" fill="#111827" stroke="#8A2BE2" stroke-opacity="0.3"/>
      <text x="317" y="16" class="mono" font-size="11" fill="#8A2BE2" text-anchor="middle">Docker</text>
    </g>

    <!-- CTA Button Links -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="160" height="38" rx="8" fill="url(#cyan-green-3)" filter="url(#glow-3)"/>
      <text x="80" y="24" class="sans" font-size="13" font-weight="bold" fill="#050816" text-anchor="middle">⚡ VIEW SOURCE</text>

      <rect x="180" y="0" width="160" height="38" rx="8" fill="#111827" stroke="#6A5CFF" stroke-width="1"/>
      <text x="260" y="24" class="sans" font-size="13" font-weight="bold" fill="#6A5CFF" text-anchor="middle">🚀 DOCS &amp; DEMO</text>
    </g>
  </g>
</svg>
