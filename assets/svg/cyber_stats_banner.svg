<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 160" width="100%" height="100%">
  <defs>
    <linearGradient id="stats-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="neon-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <linearGradient id="neon-purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6A5CFF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>

    <filter id="stats-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Consolas', 'Fira Code', monospace; }
    .sans { font-family: 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Container -->
  <rect width="1100" height="160" rx="16" fill="url(#stats-bg)" stroke="#00F5FF" stroke-opacity="0.4" stroke-width="1.5" filter="url(#stats-glow)"/>

  <!-- 4 HUD Stat Columns -->
  <!-- Col 1 -->
  <g transform="translate(40, 35)">
    <text x="0" y="20" class="mono" font-size="12" fill="#00F5FF" font-weight="bold">AI MODEL ACCURACY</text>
    <text x="0" y="55" class="sans" font-size="32" font-weight="900" fill="#ffffff">99.82%</text>
    <text x="0" y="75" class="mono" font-size="11" fill="#00FFA3">&gt; Vision &amp; Gesture Models</text>
    <line x1="220" y1="0" x2="220" y2="90" stroke="#00F5FF" stroke-opacity="0.2"/>
  </g>

  <!-- Col 2 -->
  <g transform="translate(310, 35)">
    <text x="0" y="20" class="mono" font-size="12" fill="#6A5CFF" font-weight="bold">CODE PRODUCTION</text>
    <text x="0" y="55" class="sans" font-size="32" font-weight="900" fill="#ffffff">100K+</text>
    <text x="0" y="75" class="mono" font-size="11" fill="#6A5CFF">&gt; Lines Written &amp; Tested</text>
    <line x1="220" y1="0" x2="220" y2="90" stroke="#6A5CFF" stroke-opacity="0.2"/>
  </g>

  <!-- Col 3 -->
  <g transform="translate(580, 35)">
    <text x="0" y="20" class="mono" font-size="12" fill="#00FFA3" font-weight="bold">SYSTEM LATENCY</text>
    <text x="0" y="55" class="sans" font-size="32" font-weight="900" fill="#ffffff">&lt; 2.5ms</text>
    <text x="0" y="75" class="mono" font-size="11" fill="#00FFA3">&gt; Real-Time OpenCV Loop</text>
    <line x1="220" y1="0" x2="220" y2="90" stroke="#00FFA3" stroke-opacity="0.2"/>
  </g>

  <!-- Col 4 -->
  <g transform="translate(850, 35)">
    <text x="0" y="20" class="mono" font-size="12" fill="#8A2BE2" font-weight="bold">SYSTEM STATUS</text>
    <text x="0" y="55" class="sans" font-size="32" font-weight="900" fill="#00F5FF">100%</text>
    <text x="0" y="75" class="mono" font-size="11" fill="#8A2BE2">&gt; Uptime &amp; Operations</text>
  </g>
</svg>
