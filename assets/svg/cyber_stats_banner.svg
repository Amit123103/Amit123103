<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 160" width="100%" height="100%">
  <defs>
    <linearGradient id="stats-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="indigo-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="stats-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Container -->
  <rect width="1100" height="160" rx="16" fill="url(#stats-bg)" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5" filter="url(#stats-blur)"/>

  <!-- 4 Stat Columns -->
  <!-- Column 1 -->
  <g transform="translate(40, 35)">
    <text x="0" y="20" class="font-mono" font-size="12" fill="#06B6D4" font-weight="700">AI MODEL ACCURACY</text>
    <text x="0" y="56" class="font-sans" font-size="34" font-weight="900" fill="#F9FAFB">99.82%</text>
    <text x="0" y="78" class="font-mono" font-size="11" fill="#10B981">&gt; Vision &amp; Gesture Core</text>
    <line x1="220" y1="0" x2="220" y2="90" stroke="#06B6D4" stroke-opacity="0.2"/>
  </g>

  <!-- Column 2 -->
  <g transform="translate(310, 35)">
    <text x="0" y="20" class="font-mono" font-size="12" fill="#4F46E5" font-weight="700">PRODUCTION CODE</text>
    <text x="0" y="56" class="font-sans" font-size="34" font-weight="900" fill="#F9FAFB">100K+</text>
    <text x="0" y="78" class="font-mono" font-size="11" fill="#4F46E5">&gt; Tested Lines of Code</text>
    <line x1="220" y1="0" x2="220" y2="90" stroke="#4F46E5" stroke-opacity="0.2"/>
  </g>

  <!-- Column 3 -->
  <g transform="translate(580, 35)">
    <text x="0" y="20" class="font-mono" font-size="12" fill="#10B981" font-weight="700">SYSTEM LATENCY</text>
    <text x="0" y="56" class="font-sans" font-size="34" font-weight="900" fill="#F9FAFB">&lt; 2.5ms</text>
    <text x="0" y="78" class="font-mono" font-size="11" fill="#10B981">&gt; Real-Time OpenCV Loop</text>
    <line x1="220" y1="0" x2="220" y2="90" stroke="#10B981" stroke-opacity="0.2"/>
  </g>

  <!-- Column 4 -->
  <g transform="translate(850, 35)">
    <text x="0" y="20" class="font-mono" font-size="12" fill="#8B5CF6" font-weight="700">SYSTEM UPTIME</text>
    <text x="0" y="56" class="font-sans" font-size="34" font-weight="900" fill="#06B6D4">100%</text>
    <text x="0" y="78" class="font-mono" font-size="11" fill="#8B5CF6">&gt; Operational Telemetry</text>
  </g>
</svg>
