<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="indigo-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="neon-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card-title { font-size: 14px; font-weight: bold; fill: #06B6D4; letter-spacing: 1px; }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="480" rx="16" fill="url(#bg-glass)" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Top Title -->
  <g class="mono" transform="translate(30, 40)">
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#06B6D4" filter="url(#neon-glow-filter)">&gt; TECHNICAL SKILLS &amp; TELEMETRY MATRIX</text>
    <text x="940" y="0" font-size="12" fill="#10B981" text-anchor="end">STATUS: OPTIMIZED [100%]</text>
    <line x1="0" y1="15" x2="940" y2="15" stroke="#06B6D4" stroke-opacity="0.2"/>
  </g>

  <!-- Matrix Grid of 4 Floating Glass Category Cards -->
  <!-- Card 1: OS Kernel & Systems Programming -->
  <g transform="translate(30, 80)">
    <rect width="450" height="170" rx="12" fill="#111827" fill-opacity="0.8" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="30" class="mono card-title">⚙️ OS &amp; SYSTEMS PROGRAMMING</text>
    
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">C / C++ / NASM Assembly</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#10B981" text-anchor="end">96%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#030712"/>
      <rect x="0" y="20" width="393" height="6" rx="3" fill="url(#cyan-glow)" filter="url(#neon-glow-filter)"/>
    </g>

    <g transform="translate(20, 98)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">x86_64 Kernel, Paging &amp; VFS Internals</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#10B981" text-anchor="end">94%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#030712"/>
      <rect x="0" y="20" width="385" height="6" rx="3" fill="url(#indigo-glow)" filter="url(#neon-glow-filter)"/>
    </g>
  </g>

  <!-- Card 2: MLOps, DevOps & Cloud -->
  <g transform="translate(520, 80)">
    <rect width="450" height="170" rx="12" fill="#111827" fill-opacity="0.8" stroke="#4F46E5" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="30" class="mono card-title" fill="#4F46E5">🚀 MLOPS &amp; DEVOPS PIPELINES</text>
    
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">Docker / Kubernetes / CI/CD Actions</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#4F46E5" text-anchor="end">92%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#030712"/>
      <rect x="0" y="20" width="377" height="6" rx="3" fill="url(#indigo-glow)" filter="url(#neon-glow-filter)"/>
    </g>

    <g transform="translate(20, 98)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">Linux, Config Management &amp; Cloud</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#4F46E5" text-anchor="end">90%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#030712"/>
      <rect x="0" y="20" width="369" height="6" rx="3" fill="url(#cyan-glow)" filter="url(#neon-glow-filter)"/>
    </g>
  </g>

  <!-- Card 3: Machine Learning & Python -->
  <g transform="translate(30, 270)">
    <rect width="450" height="170" rx="12" fill="#111827" fill-opacity="0.8" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="30" class="mono card-title" fill="#10B981">🧠 MACHINE LEARNING &amp; PYTHON</text>
    
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">Python &amp; ML Architecture</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#10B981" text-anchor="end">93%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#030712"/>
      <rect x="0" y="20" width="381" height="6" rx="3" fill="url(#cyan-glow)" filter="url(#neon-glow-filter)"/>
    </g>

    <g transform="translate(20, 98)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">PyTorch / TensorFlow / OpenCV</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#10B981" text-anchor="end">88%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#030712"/>
      <rect x="0" y="20" width="360" height="6" rx="3" fill="url(#indigo-glow)" filter="url(#neon-glow-filter)"/>
    </g>
  </g>

  <!-- Card 4: Networking & Blockchain -->
  <g transform="translate(520, 270)">
    <rect width="450" height="170" rx="12" fill="#111827" fill-opacity="0.8" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="30" class="mono card-title" fill="#8B5CF6">🌐 NETWORKING &amp; BLOCKCHAIN</text>
    
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">TCP/IP, UDP, DHCP, ICMP, ARP Stack</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#8B5CF6" text-anchor="end">90%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#030712"/>
      <rect x="0" y="20" width="369" height="6" rx="3" fill="url(#indigo-glow)" filter="url(#neon-glow-filter)"/>
    </g>

    <g transform="translate(20, 98)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">Blockchain &amp; Distributed Systems</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#8B5CF6" text-anchor="end">85%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#030712"/>
      <rect x="0" y="20" width="348" height="6" rx="3" fill="url(#cyan-glow)" filter="url(#neon-glow-filter)"/>
    </g>
  </g>
</svg>
