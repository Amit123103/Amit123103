<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1424" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0D14" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D00FF"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <filter id="neon-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card-title { font-size: 14px; font-weight: bold; fill: #00FF9D; letter-spacing: 1px; }
  </style>

  <rect width="1000" height="480" rx="16" fill="url(#bg-glass)" stroke="#00FF9D" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Header -->
  <g class="mono" transform="translate(30, 40)">
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#00FF9D" filter="url(#neon-glow-filter)">&gt; 3D QUANTUM TECHNICAL MATRIX</text>
    <text x="940" y="0" font-size="12" fill="#00E5FF" text-anchor="end">STATUS: OPTIMIZED [100%]</text>
    <line x1="0" y1="15" x2="940" y2="15" stroke="#00FF9D" stroke-opacity="0.2"/>
  </g>

  <!-- Card 1 -->
  <g transform="translate(30, 80)">
    <rect width="450" height="170" rx="12" fill="#161B33" fill-opacity="0.8" stroke="#00FF9D" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="30" class="mono card-title">⚙️ OS &amp; KERNEL DEVELOPMENT</text>
    
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">C / C++ / NASM Assembly / x86_64</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#00FF9D" text-anchor="end">96%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#0A0D14"/>
      <rect x="0" y="20" width="393" height="6" rx="3" fill="url(#emerald-glow)" filter="url(#neon-glow-filter)"/>
    </g>

    <g transform="translate(20, 98)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">Multiboot2, Virtual Memory &amp; FAT32 VFS</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#00FF9D" text-anchor="end">94%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#0A0D14"/>
      <rect x="0" y="20" width="385" height="6" rx="3" fill="url(#violet-glow)" filter="url(#neon-glow-filter)"/>
    </g>
  </g>

  <!-- Card 2 -->
  <g transform="translate(520, 80)">
    <rect width="450" height="170" rx="12" fill="#161B33" fill-opacity="0.8" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="30" class="mono card-title" fill="#00E5FF">🚀 MLOPS &amp; DEVOPS PIPELINES</text>
    
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">Docker / Kubernetes / CI/CD Actions</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#00E5FF" text-anchor="end">92%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#0A0D14"/>
      <rect x="0" y="20" width="377" height="6" rx="3" fill="url(#violet-glow)" filter="url(#neon-glow-filter)"/>
    </g>

    <g transform="translate(20, 98)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">Linux, Config Management &amp; Cloud</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#00E5FF" text-anchor="end">90%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#0A0D14"/>
      <rect x="0" y="20" width="369" height="6" rx="3" fill="url(#emerald-glow)" filter="url(#neon-glow-filter)"/>
    </g>
  </g>

  <!-- Card 3 -->
  <g transform="translate(30, 270)">
    <rect width="450" height="170" rx="12" fill="#161B33" fill-opacity="0.8" stroke="#9D00FF" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="30" class="mono card-title" fill="#9D00FF">🧠 MACHINE LEARNING &amp; PYTHON</text>
    
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">Python &amp; ML Systems Architecture</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#9D00FF" text-anchor="end">93%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#0A0D14"/>
      <rect x="0" y="20" width="381" height="6" rx="3" fill="url(#emerald-glow)" filter="url(#neon-glow-filter)"/>
    </g>

    <g transform="translate(20, 98)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">PyTorch / TensorFlow / OpenCV</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#9D00FF" text-anchor="end">88%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#0A0D14"/>
      <rect x="0" y="20" width="360" height="6" rx="3" fill="url(#violet-glow)" filter="url(#neon-glow-filter)"/>
    </g>
  </g>

  <!-- Card 4 -->
  <g transform="translate(520, 270)">
    <rect width="450" height="170" rx="12" fill="#161B33" fill-opacity="0.8" stroke="#FFD700" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="30" class="mono card-title" fill="#FFD700">🌐 NETWORKING &amp; BLOCKCHAIN</text>
    
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">TCP/IP, UDP, DHCP, ICMP Stack</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#FFD700" text-anchor="end">90%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#0A0D14"/>
      <rect x="0" y="20" width="369" height="6" rx="3" fill="url(#violet-glow)" filter="url(#neon-glow-filter)"/>
    </g>

    <g transform="translate(20, 98)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">Blockchain &amp; Distributed Systems</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#FFD700" text-anchor="end">85%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#0A0D14"/>
      <rect x="0" y="20" width="348" height="6" rx="3" fill="url(#emerald-glow)" filter="url(#neon-glow-filter)"/>
    </g>
  </g>
</svg>
