<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6A5CFF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>

    <filter id="neon-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes progress-fill {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .mono { font-family: 'Consolas', 'Fira Code', monospace; }
    .sans { font-family: 'Segoe UI', Roboto, sans-serif; }
    .card-title { font-size: 14px; font-weight: bold; fill: #00F5FF; letter-spacing: 1px; }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="480" rx="16" fill="url(#bg-glass)" stroke="#00F5FF" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Top Title -->
  <g class="mono" transform="translate(30, 40)">
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#00F5FF" filter="url(#neon-glow-filter)">&gt; 3D SKILLS &amp; TELEMETRY MATRIX</text>
    <text x="940" y="0" font-size="12" fill="#00FFA3" text-anchor="end">STATUS: OPTIMIZED [100%]</text>
    <line x1="0" y1="15" x2="940" y2="15" stroke="#00F5FF" stroke-opacity="0.2"/>
  </g>

  <!-- Matrix Grid of 4 Floating Glass Category Cards -->
  <!-- Card 1: Machine Learning & AI -->
  <g transform="translate(30, 80)">
    <rect width="450" height="170" rx="12" fill="#111827" fill-opacity="0.8" stroke="#00F5FF" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="30" class="mono card-title">🧠 MACHINE LEARNING &amp; AI</text>
    
    <!-- Skill Item 1 -->
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">PyTorch / TensorFlow / Keras</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#00FFA3" text-anchor="end">92%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#050816"/>
      <rect x="0" y="20" width="377" height="6" rx="3" fill="url(#cyan-glow)" filter="url(#neon-glow-filter)"/>
    </g>

    <!-- Skill Item 2 -->
    <g transform="translate(20, 98)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">Computer Vision &amp; OpenCV</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#00FFA3" text-anchor="end">88%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#050816"/>
      <rect x="0" y="20" width="360" height="6" rx="3" fill="url(#purple-glow)" filter="url(#neon-glow-filter)"/>
    </g>
  </g>

  <!-- Card 2: Software Engineering & Languages -->
  <g transform="translate(520, 80)">
    <rect width="450" height="170" rx="12" fill="#111827" fill-opacity="0.8" stroke="#6A5CFF" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="30" class="mono card-title" fill="#6A5CFF">💻 LANGUAGES &amp; CORE CS</text>
    
    <!-- Skill Item 1 -->
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">Python &amp; C++</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#6A5CFF" text-anchor="end">95%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#050816"/>
      <rect x="0" y="20" width="389" height="6" rx="3" fill="url(#purple-glow)" filter="url(#neon-glow-filter)"/>
    </g>

    <!-- Skill Item 2 -->
    <g transform="translate(20, 98)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">JavaScript / Java / C</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#6A5CFF" text-anchor="end">90%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#050816"/>
      <rect x="0" y="20" width="369" height="6" rx="3" fill="url(#cyan-glow)" filter="url(#neon-glow-filter)"/>
    </g>
  </g>

  <!-- Card 3: Web & Full-Stack -->
  <g transform="translate(30, 270)">
    <rect width="450" height="170" rx="12" fill="#111827" fill-opacity="0.8" stroke="#00FFA3" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="30" class="mono card-title" fill="#00FFA3">⚡ WEB &amp; BACKEND</text>
    
    <!-- Skill Item 1 -->
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">React.js / Vite / Node.js</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#00FFA3" text-anchor="end">90%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#050816"/>
      <rect x="0" y="20" width="369" height="6" rx="3" fill="url(#cyan-glow)" filter="url(#neon-glow-filter)"/>
    </g>

    <!-- Skill Item 2 -->
    <g transform="translate(20, 98)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">FastAPI / Flask / REST APIs</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#00FFA3" text-anchor="end">87%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#050816"/>
      <rect x="0" y="20" width="356" height="6" rx="3" fill="url(#purple-glow)" filter="url(#neon-glow-filter)"/>
    </g>
  </g>

  <!-- Card 4: Cloud, DevOps & Tools -->
  <g transform="translate(520, 270)">
    <rect width="450" height="170" rx="12" fill="#111827" fill-opacity="0.8" stroke="#8A2BE2" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="30" class="mono card-title" fill="#8A2BE2">🚀 CLOUD, DEVOPS &amp; DATABASES</text>
    
    <!-- Skill Item 1 -->
    <g transform="translate(20, 48)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">Docker / Git / GitHub Actions</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#8A2BE2" text-anchor="end">88%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#050816"/>
      <rect x="0" y="20" width="360" height="6" rx="3" fill="url(#purple-glow)" filter="url(#neon-glow-filter)"/>
    </g>

    <!-- Skill Item 2 -->
    <g transform="translate(20, 98)">
      <text x="0" y="12" class="mono" font-size="12" fill="#ffffff">MongoDB / MySQL / GCP / Azure</text>
      <text x="410" y="12" class="mono" font-size="11" fill="#8A2BE2" text-anchor="end">85%</text>
      <rect x="0" y="20" width="410" height="6" rx="3" fill="#050816"/>
      <rect x="0" y="20" width="348" height="6" rx="3" fill="url(#cyan-glow)" filter="url(#neon-glow-filter)"/>
    </g>
  </g>
</svg>
