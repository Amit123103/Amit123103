<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1424" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0D14" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="emerald-cyan-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <filter id="glow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect x="5" y="5" width="590" height="310" rx="16" fill="url(#card-bg-1)" stroke="#00FF9D" stroke-opacity="0.6" stroke-width="1.5" filter="url(#glow-1)"/>

  <rect x="5" y="5" width="590" height="40" rx="16" fill="#161B33"/>
  <text x="25" y="30" class="mono" font-size="12" font-weight="bold" fill="#00FF9D">&gt; FLAGSHIP PROJECT // 01</text>
  <rect x="440" y="15" width="135" height="22" rx="11" fill="#0A0D14" stroke="#00FF9D" stroke-opacity="0.5"/>
  <text x="507" y="30" class="mono" font-size="10" fill="#00FF9D" text-anchor="middle">64-BIT OS KERNEL</text>

  <g transform="translate(25, 75)">
    <text x="0" y="0" class="sans" font-size="22" font-weight="900" fill="#ffffff">⚙️ MyKernel: 64-Bit x86_64 OS Kernel</text>
    
    <text x="0" y="30" class="sans" font-size="13" fill="#F8FAFC" opacity="0.95">
      Modular 64-bit OS kernel built from scratch featuring Multiboot2,
    </text>
    <text x="0" y="50" class="sans" font-size="13" fill="#F8FAFC" opacity="0.95">
      Virtual Memory, FAT32 VFS, IPC, TCP/IP, UDP &amp; DHCP Network Stack.
    </text>

    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="45" height="24" rx="6" fill="#161B33" stroke="#00FF9D" stroke-opacity="0.4"/>
      <text x="22" y="16" class="mono" font-size="11" fill="#00FF9D" text-anchor="middle">C</text>

      <rect x="55" y="0" width="115" height="24" rx="6" fill="#161B33" stroke="#00E5FF" stroke-opacity="0.4"/>
      <text x="112" y="16" class="mono" font-size="11" fill="#00E5FF" text-anchor="middle">NASM Assembly</text>

      <rect x="180" y="0" width="80" height="24" rx="6" fill="#161B33" stroke="#9D00FF" stroke-opacity="0.4"/>
      <text x="220" y="16" class="mono" font-size="11" fill="#9D00FF" text-anchor="middle">x86_64</text>

      <rect x="270" y="0" width="105" height="24" rx="6" fill="#161B33" stroke="#FFD700" stroke-opacity="0.4"/>
      <text x="322" y="16" class="mono" font-size="11" fill="#FFD700" text-anchor="middle">TCP/IP Stack</text>
    </g>

    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="160" height="38" rx="8" fill="url(#emerald-cyan-1)" filter="url(#glow-1)"/>
      <text x="80" y="24" class="sans" font-size="13" font-weight="bold" fill="#0A0D14" text-anchor="middle">⚡ VIEW KERNEL</text>

      <rect x="180" y="0" width="160" height="38" rx="8" fill="#161B33" stroke="#00FF9D" stroke-width="1"/>
      <text x="260" y="24" class="sans" font-size="13" font-weight="bold" fill="#00FF9D" text-anchor="middle">📖 ARCH SPECS</text>
    </g>
  </g>
</svg>
