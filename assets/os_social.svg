<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
    <defs>
        <radialGradient id="planet-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="30%" stop-color="#00F5FF" />
            <stop offset="100%" stop-color="rgba(0,0,0,0)" />
        </radialGradient>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Jura:wght@700&amp;display=swap');
            text { font-family: 'Jura', sans-serif; fill: #FFF; font-weight: bold; font-size: 14px; text-anchor: middle; }
            .float { animation: floatP 4s ease-in-out infinite alternate; }
            @keyframes floatP { 0% { transform: translateY(-5px); } 100% { transform: translateY(5px); } }
        </style>
    </defs>
    <!-- Social Planets -->

        <g class="float" style="animation-delay: 0.0s;">
            <!-- Outer atmosphere -->
            <circle cx="200.0" cy="80" r="40" fill="url(#planet-glow)" opacity="0.3" />
            <!-- Planet Core -->
            <circle cx="200.0" cy="80" r="25" fill="#090B13" stroke="#00F5FF" stroke-width="2" stroke-dasharray="5 5" />
            <!-- Inner Ring -->
            <ellipse cx="200.0" cy="80" rx="35" ry="10" fill="none" stroke="#4F46E5" stroke-width="2" transform="rotate(20 200.0 80)" />
            <text x="200.0" y="130">LINKEDIN</text>
        </g>

        <g class="float" style="animation-delay: 0.5s;">
            <!-- Outer atmosphere -->
            <circle cx="400.0" cy="80" r="40" fill="url(#planet-glow)" opacity="0.3" />
            <!-- Planet Core -->
            <circle cx="400.0" cy="80" r="25" fill="#090B13" stroke="#00F5FF" stroke-width="2" stroke-dasharray="5 5" />
            <!-- Inner Ring -->
            <ellipse cx="400.0" cy="80" rx="35" ry="10" fill="none" stroke="#4F46E5" stroke-width="2" transform="rotate(20 400.0 80)" />
            <text x="400.0" y="130">PORTFOLIO</text>
        </g>

        <g class="float" style="animation-delay: 1.0s;">
            <!-- Outer atmosphere -->
            <circle cx="600.0" cy="80" r="40" fill="url(#planet-glow)" opacity="0.3" />
            <!-- Planet Core -->
            <circle cx="600.0" cy="80" r="25" fill="#090B13" stroke="#00F5FF" stroke-width="2" stroke-dasharray="5 5" />
            <!-- Inner Ring -->
            <ellipse cx="600.0" cy="80" rx="35" ry="10" fill="none" stroke="#4F46E5" stroke-width="2" transform="rotate(20 600.0 80)" />
            <text x="600.0" y="130">GITHUB</text>
        </g>

        <g class="float" style="animation-delay: 1.5s;">
            <!-- Outer atmosphere -->
            <circle cx="800.0" cy="80" r="40" fill="url(#planet-glow)" opacity="0.3" />
            <!-- Planet Core -->
            <circle cx="800.0" cy="80" r="25" fill="#090B13" stroke="#00F5FF" stroke-width="2" stroke-dasharray="5 5" />
            <!-- Inner Ring -->
            <ellipse cx="800.0" cy="80" rx="35" ry="10" fill="none" stroke="#4F46E5" stroke-width="2" transform="rotate(20 800.0 80)" />
            <text x="800.0" y="130">TWITTER</text>
        </g>

        <g class="float" style="animation-delay: 2.0s;">
            <!-- Outer atmosphere -->
            <circle cx="1000.0" cy="80" r="40" fill="url(#planet-glow)" opacity="0.3" />
            <!-- Planet Core -->
            <circle cx="1000.0" cy="80" r="25" fill="#090B13" stroke="#00F5FF" stroke-width="2" stroke-dasharray="5 5" />
            <!-- Inner Ring -->
            <ellipse cx="1000.0" cy="80" rx="35" ry="10" fill="none" stroke="#4F46E5" stroke-width="2" transform="rotate(20 1000.0 80)" />
            <text x="1000.0" y="130">DISCORD</text>
        </g>
</svg>