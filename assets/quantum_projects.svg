<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
    <defs>
        <style>
            text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #FFFFFF; }
            .proj-card { fill: rgba(15, 23, 42, 0.75); stroke: rgba(0, 245, 255, 0.3); stroke-width: 1; rx: 14; }
            .tag { fill: rgba(0, 245, 255, 0.1); stroke: #00F5FF; stroke-width: 1; rx: 10; }
            .btn { fill: #00F5FF; rx: 8; }
            .hover-card { animation: cardFloat 5s ease-in-out infinite alternate; }
            @keyframes cardFloat { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
        </style>
    </defs>
    
    <text x="600" y="40" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="3" fill="#00F5FF">FEATURED QUANTUM PROJECTS</text>
    <rect x="580" y="52" width="40" height="2" fill="#FFD700" />

    <g transform="translate(60, 100)">
        <g class="hover-card" style="animation-delay: 0.12s;">
            <rect x="0" y="0" width="320" height="310" class="proj-card" />
            
            <rect x="15" y="15" width="290" height="130" fill="rgba(0, 245, 255, 0.05)" rx="8" stroke="rgba(255, 215, 0, 0.2)" />
            <text x="160" y="85" font-size="14" font-weight="700" fill="#00F5FF" text-anchor="middle">⚡ HIGH PERFORMANCE</text>
            
            <text x="20" y="175" font-size="17" font-weight="700">AI Vision System</text>
            <text x="20" y="200" font-size="13" fill="#94A3B8">Real-time object tracking &amp; computer vision pipeline.</text>
            
            <!-- Tags -->
            <rect x="20" y="225" width="80" height="22" class="tag" />
            <text x="60" y="240" font-size="11" font-weight="600" fill="#00F5FF" text-anchor="middle">PyTorch</text>
            
            <rect x="110" y="225" width="80" height="22" class="tag" />
            <text x="150" y="240" font-size="11" font-weight="600" fill="#00F5FF" text-anchor="middle">OpenCV</text>
            
            <!-- Button -->
            <rect x="20" y="262" width="280" height="32" class="btn" />
            <text x="160" y="283" font-size="13" font-weight="800" fill="#020408" text-anchor="middle">EXPLORE REPOSITORY →</text>
        </g>
    </g>

    <g transform="translate(440, 100)">
        <g class="hover-card" style="animation-delay: 0.88s;">
            <rect x="0" y="0" width="320" height="310" class="proj-card" />
            
            <rect x="15" y="15" width="290" height="130" fill="rgba(0, 245, 255, 0.05)" rx="8" stroke="rgba(255, 215, 0, 0.2)" />
            <text x="160" y="85" font-size="14" font-weight="700" fill="#00F5FF" text-anchor="middle">⚡ HIGH PERFORMANCE</text>
            
            <text x="20" y="175" font-size="17" font-weight="700">Quantum RAG Engine</text>
            <text x="20" y="200" font-size="13" fill="#94A3B8">High-performance generative retrieval AI framework.</text>
            
            <!-- Tags -->
            <rect x="20" y="225" width="80" height="22" class="tag" />
            <text x="60" y="240" font-size="11" font-weight="600" fill="#00F5FF" text-anchor="middle">LangChain</text>
            
            <rect x="110" y="225" width="80" height="22" class="tag" />
            <text x="150" y="240" font-size="11" font-weight="600" fill="#00F5FF" text-anchor="middle">FastAPI</text>
            
            <!-- Button -->
            <rect x="20" y="262" width="280" height="32" class="btn" />
            <text x="160" y="283" font-size="13" font-weight="800" fill="#020408" text-anchor="middle">EXPLORE REPOSITORY →</text>
        </g>
    </g>

    <g transform="translate(820, 100)">
        <g class="hover-card" style="animation-delay: 1.64s;">
            <rect x="0" y="0" width="320" height="310" class="proj-card" />
            
            <rect x="15" y="15" width="290" height="130" fill="rgba(0, 245, 255, 0.05)" rx="8" stroke="rgba(255, 215, 0, 0.2)" />
            <text x="160" y="85" font-size="14" font-weight="700" fill="#00F5FF" text-anchor="middle">⚡ HIGH PERFORMANCE</text>
            
            <text x="20" y="175" font-size="17" font-weight="700">Cloud MLOps Pipeline</text>
            <text x="20" y="200" font-size="13" fill="#94A3B8">Automated deployment &amp; monitoring architecture.</text>
            
            <!-- Tags -->
            <rect x="20" y="225" width="80" height="22" class="tag" />
            <text x="60" y="240" font-size="11" font-weight="600" fill="#00F5FF" text-anchor="middle">AWS</text>
            
            <rect x="110" y="225" width="80" height="22" class="tag" />
            <text x="150" y="240" font-size="11" font-weight="600" fill="#00F5FF" text-anchor="middle">Docker</text>
            
            <!-- Button -->
            <rect x="20" y="262" width="280" height="32" class="btn" />
            <text x="160" y="283" font-size="13" font-weight="800" fill="#020408" text-anchor="middle">EXPLORE REPOSITORY →</text>
        </g>
    </g>
</svg>