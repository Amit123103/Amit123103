            <circle cx="16" cy="20" r="3" fill="#EE4C2C" />
            <!-- Label -->
            <text x="78.5" y="25" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">PyTorch</text>
        </g>

        <!-- 3D Chip: TensorFlow -->
        <g transform="translate(279, 0)" class="chip-glow">
            <!-- 3D Pedestal Shadow -->
            <rect x="2" y="4" width="162" height="40" rx="10" fill="rgba(0,0,0,0.6)" />
            <!-- Chip Body with 3D Bevel -->
            <rect x="0" y="0" width="162" height="40" rx="10" fill="url(#chip-grad)" stroke="#FF6F00" stroke-width="1.2" />
            <!-- Top Neon Accent Line -->
