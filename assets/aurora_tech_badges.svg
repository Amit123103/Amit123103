        <!-- 3D Chip: TypeScript -->
        <g transform="translate(290, 52)" class="chip-glow">
            <!-- 3D Pedestal Shadow -->
            <rect x="2" y="4" width="162" height="40" rx="10" fill="rgba(0,0,0,0.6)" />
            <!-- Chip Body with 3D Bevel -->
            <rect x="0" y="0" width="162" height="40" rx="10" fill="url(#chip-grad)" stroke="#3178C6" stroke-width="1.2" />
            <!-- Top Neon Accent Line -->
