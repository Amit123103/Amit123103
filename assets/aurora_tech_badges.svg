        </g>

        <!-- 3D Chip: React -->
        <g transform="translate(167, 52)" class="chip-glow">
            <!-- 3D Pedestal Shadow -->
            <rect x="2" y="4" width="107" height="40" rx="10" fill="rgba(0,0,0,0.6)" />
            <!-- Chip Body with 3D Bevel -->
