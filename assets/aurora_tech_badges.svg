            <!-- Top Neon Accent Line -->
            <rect x="0" y="0" width="85" height="2" rx="1" fill="#FF9900" />
            <!-- Status Node -->
            <circle cx="16" cy="20" r="5" fill="rgba(255,255,255,0.06)" />
            <circle cx="16" cy="20" r="3" fill="#FF9900" />
