<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
    <defs>
        <style>
            @keyframes tubeGlow {
                0%, 100% { filter: drop-shadow(0 0 4px rgba(0, 245, 255, 0.4)); }
                50% { filter: drop-shadow(0 0 12px rgba(0, 245, 255, 0.85)); }
            }
            @keyframes shimmerBar {
                0% { transform: translateX(-200px); opacity: 0; }
                50% { opacity: 0.7; }
                100% { transform: translateX(960px); opacity: 0; }
            }
            
            text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; fill: #FFFFFF; }
            .tube-anim { animation: tubeGlow 3s ease-in-out infinite alternate; }
        </style>

        <linearGradient id="lang-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#050a18" />
            <stop offset="50%" stop-color="#090e22" />
            <stop offset="100%" stop-color="#030611" />
        </linearGradient>
    </defs>
    
    <!-- 3D Deck Frame -->
    <rect width="100%" height="100%" fill="url(#lang-bg)" rx="16" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" />
    
    <!-- Title -->
    <text x="600" y="38" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="2.5" fill="#38BDF8">CORE PROFICIENCY &amp; TECHNICAL CAPABILITY BREAKDOWN</text>
    <rect x="560" y="48" width="80" height="2" fill="#818CF8" rx="1" />

        <!-- 3D Skill Gauge: Python &amp; Deep Learning (PyTorch / CUDA / TF) -->
        <g transform="translate(80, 75)">
            <!-- Label & Percentage Chip -->
            <text x="0" y="16" font-size="13" font-weight="700" fill="#F8FAFC">Python &amp; Deep Learning (PyTorch / CUDA / TF)</text>
            <rect x="910" y="0" width="50" height="22" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="#00F5FF" stroke-width="1" />
            <text x="935" y="15" font-size="11.5" font-weight="800" fill="#00F5FF" text-anchor="middle">95%</text>
            
            <!-- 3D Track Base with Inset Shadow -->
            <rect x="0" y="26" width="960" height="14" rx="7" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
            
            <!-- 3D Neon Power Tube Fill -->
            <rect x="1" y="27" width="836" height="12" rx="6" fill="#00F5FF" class="tube-anim" />
            <rect x="1" y="27" width="836" height="2" rx="1" fill="#FFFFFF" opacity="0.4" />
            <!-- Glowing Plasma Tip -->
            <circle cx="836" cy="33" r="5" fill="#FFFFFF" />
            <circle cx="836" cy="33" r="8" fill="#00F5FF" opacity="0.5" />
        </g>

        <!-- 3D Skill Gauge: Generative AI &amp; Agentic RAG (LangChain / LLMs) -->
        <g transform="translate(80, 129)">
            <!-- Label & Percentage Chip -->
            <text x="0" y="16" font-size="13" font-weight="700" fill="#F8FAFC">Generative AI &amp; Agentic RAG (LangChain / LLMs)</text>
            <rect x="910" y="0" width="50" height="22" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="#818CF8" stroke-width="1" />
            <text x="935" y="15" font-size="11.5" font-weight="800" fill="#818CF8" text-anchor="middle">92%</text>
            
            <!-- 3D Track Base with Inset Shadow -->
            <rect x="0" y="26" width="960" height="14" rx="7" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
            
            <!-- 3D Neon Power Tube Fill -->
            <rect x="1" y="27" width="809" height="12" rx="6" fill="#818CF8" class="tube-anim" />
            <rect x="1" y="27" width="809" height="2" rx="1" fill="#FFFFFF" opacity="0.4" />
            <!-- Glowing Plasma Tip -->
            <circle cx="809" cy="33" r="5" fill="#FFFFFF" />
            <circle cx="809" cy="33" r="8" fill="#818CF8" opacity="0.5" />
        </g>

        <!-- 3D Skill Gauge: Cloud Infrastructure (AWS EKS / Docker / Kubernetes) -->
        <g transform="translate(80, 183)">
            <!-- Label & Percentage Chip -->
            <text x="0" y="16" font-size="13" font-weight="700" fill="#F8FAFC">Cloud Infrastructure (AWS EKS / Docker / Kubernetes)</text>
            <rect x="910" y="0" width="50" height="22" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="#C084FC" stroke-width="1" />
            <text x="935" y="15" font-size="11.5" font-weight="800" fill="#C084FC" text-anchor="middle">88%</text>
            
            <!-- 3D Track Base with Inset Shadow -->
            <rect x="0" y="26" width="960" height="14" rx="7" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
            
            <!-- 3D Neon Power Tube Fill -->
            <rect x="1" y="27" width="774" height="12" rx="6" fill="#C084FC" class="tube-anim" />
            <rect x="1" y="27" width="774" height="2" rx="1" fill="#FFFFFF" opacity="0.4" />
            <!-- Glowing Plasma Tip -->
            <circle cx="774" cy="33" r="5" fill="#FFFFFF" />
            <circle cx="774" cy="33" r="8" fill="#C084FC" opacity="0.5" />
        </g>

        <!-- 3D Skill Gauge: Backend APIs &amp; Microservices (FastAPI / PostgreSQL) -->
        <g transform="translate(80, 237)">
            <!-- Label & Percentage Chip -->
            <text x="0" y="16" font-size="13" font-weight="700" fill="#F8FAFC">Backend APIs &amp; Microservices (FastAPI / PostgreSQL)</text>
            <rect x="910" y="0" width="50" height="22" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="#34D399" stroke-width="1" />
            <text x="935" y="15" font-size="11.5" font-weight="800" fill="#34D399" text-anchor="middle">90%</text>
            
            <!-- 3D Track Base with Inset Shadow -->
            <rect x="0" y="26" width="960" height="14" rx="7" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
            
            <!-- 3D Neon Power Tube Fill -->
            <rect x="1" y="27" width="792" height="12" rx="6" fill="#34D399" class="tube-anim" />
            <rect x="1" y="27" width="792" height="2" rx="1" fill="#FFFFFF" opacity="0.4" />
            <!-- Glowing Plasma Tip -->
            <circle cx="792" cy="33" r="5" fill="#FFFFFF" />
            <circle cx="792" cy="33" r="8" fill="#34D399" opacity="0.5" />
        </g>

        <!-- 3D Skill Gauge: Frontend Architecture (TypeScript / React / Next.js) -->
        <g transform="translate(80, 291)">
            <!-- Label & Percentage Chip -->
            <text x="0" y="16" font-size="13" font-weight="700" fill="#F8FAFC">Frontend Architecture (TypeScript / React / Next.js)</text>
            <rect x="910" y="0" width="50" height="22" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="#F472B6" stroke-width="1" />
            <text x="935" y="15" font-size="11.5" font-weight="800" fill="#F472B6" text-anchor="middle">85%</text>
            
            <!-- 3D Track Base with Inset Shadow -->
            <rect x="0" y="26" width="960" height="14" rx="7" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
            
            <!-- 3D Neon Power Tube Fill -->
            <rect x="1" y="27" width="748" height="12" rx="6" fill="#F472B6" class="tube-anim" />
            <rect x="1" y="27" width="748" height="2" rx="1" fill="#FFFFFF" opacity="0.4" />
            <!-- Glowing Plasma Tip -->
            <circle cx="748" cy="33" r="5" fill="#FFFFFF" />
            <circle cx="748" cy="33" r="8" fill="#F472B6" opacity="0.5" />
        </g>
</svg>