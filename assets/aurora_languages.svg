<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
    <defs>
        <style>
            text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; fill: #FFFFFF; }
            .bar-bg { fill: rgba(30, 41, 59, 0.6); rx: 6; }
            .bar-fill { rx: 6; }
        </style>
    </defs>
    
    <rect width="100%" height="100%" fill="rgba(15, 23, 42, 0.7)" rx="14" stroke="rgba(255, 255, 255, 0.08)" />
    
    <!-- Title -->
    <text x="600" y="38" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="2" fill="#38BDF8">CORE PROFICIENCY &amp; SKILL BREAKDOWN</text>
    <rect x="580" y="48" width="40" height="2" fill="#818CF8" />

        <!-- Skill Row -->
        <g transform="translate(80, 85)">
            <text x="0" y="14" font-size="13" font-weight="600" fill="#E2E8F0">Python &amp; Deep Learning (PyTorch/TF)</text>
            <text x="960" y="14" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="end">95%</text>
            
            <rect x="0" y="24" width="960" height="12" class="bar-bg" />
            <rect x="0" y="24" width="760" height="12" fill="#38BDF8" class="bar-fill" />
        </g>

        <!-- Skill Row -->
        <g transform="translate(80, 130)">
            <text x="0" y="14" font-size="13" font-weight="600" fill="#E2E8F0">Generative AI &amp; RAG (LangChain/LLMs)</text>
            <text x="960" y="14" font-size="13" font-weight="700" fill="#818CF8" text-anchor="end">92%</text>
            
            <rect x="0" y="24" width="960" height="12" class="bar-bg" />
            <rect x="0" y="24" width="736" height="12" fill="#818CF8" class="bar-fill" />
        </g>

        <!-- Skill Row -->
        <g transform="translate(80, 175)">
            <text x="0" y="14" font-size="13" font-weight="600" fill="#E2E8F0">Cloud Infrastructure (AWS/Docker/K8s)</text>
            <text x="960" y="14" font-size="13" font-weight="700" fill="#C084FC" text-anchor="end">88%</text>
            
            <rect x="0" y="24" width="960" height="12" class="bar-bg" />
            <rect x="0" y="24" width="704" height="12" fill="#C084FC" class="bar-fill" />
        </g>

        <!-- Skill Row -->
        <g transform="translate(80, 220)">
            <text x="0" y="14" font-size="13" font-weight="600" fill="#E2E8F0">Backend APIs (FastAPI/Node.js/PostgreSQL)</text>
            <text x="960" y="14" font-size="13" font-weight="700" fill="#34D399" text-anchor="end">90%</text>
            
            <rect x="0" y="24" width="960" height="12" class="bar-bg" />
            <rect x="0" y="24" width="720" height="12" fill="#34D399" class="bar-fill" />
        </g>

        <!-- Skill Row -->
        <g transform="translate(80, 265)">
            <text x="0" y="14" font-size="13" font-weight="600" fill="#E2E8F0">Frontend &amp; UI (TypeScript/React/Next.js)</text>
            <text x="960" y="14" font-size="13" font-weight="700" fill="#F472B6" text-anchor="end">85%</text>
            
            <rect x="0" y="24" width="960" height="12" class="bar-bg" />
            <rect x="0" y="24" width="680" height="12" fill="#F472B6" class="bar-fill" />
        </g>
</svg>