<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
    <defs>
        <style>
            @keyframes levitate {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-6px); }
            }
            @keyframes badgeGlow {
                0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.3)); }
                50% { opacity: 0.85; filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.8)); }
            }
            @keyframes shimmer {
                0% { transform: translateX(-150px) skewX(-20deg); opacity: 0; }
                50% { opacity: 0.6; }
                100% { transform: translateX(350px) skewX(-20deg); opacity: 0; }
            }
            
            text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; fill: #FFFFFF; }
            .levitate-icon { animation: levitate 3.5s ease-in-out infinite alternate; }
            .shimmer-bar { animation: shimmer 4s ease-in-out infinite; }
            .badge-glow { animation: badgeGlow 4s ease-in-out infinite alternate; }
        </style>

        <linearGradient id="bg-deck" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#050a18" />
            <stop offset="50%" stop-color="#0b1226" />
            <stop offset="100%" stop-color="#030611" />
        </linearGradient>

        <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="rgba(255, 255, 255, 0)" />
            <stop offset="50%" stop-color="rgba(255, 255, 255, 0.4)" />
            <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
        </linearGradient>
    </defs>
    
    <!-- Outer Deck Background -->
    <rect width="100%" height="100%" fill="url(#bg-deck)" rx="16" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    
    <!-- Header Title with 3D Cyber Badges -->
    <text x="600" y="36" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="2.5" fill="#38BDF8">ENGINEERING HONORS &amp; CLOUD CERTIFICATIONS</text>
    <rect x="570" y="46" width="60" height="2" fill="#818CF8" rx="1" />

    <g transform="translate(40, 75)">

        <!-- 3D Holographic Card (AWS CLOUD ARCHITECT) -->
        <g transform="translate(0, 0)">
            <!-- 3D Drop Shadow Pedestal -->
            <rect x="4" y="6" width="260" height="96" rx="14" fill="rgba(0,0,0,0.6)" />
            
            <!-- Card Body with Glassmorphic Gradient -->
            <rect x="0" y="0" width="260" height="96" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#38BDF8" stroke-width="1.2" opacity="0.95" />
            
            <!-- Top Gradient Accent Strip -->
            <rect x="0" y="0" width="260" height="3" rx="1.5" fill="#38BDF8" />
            
            <!-- Shimmer Light Sweep Effect (Clipped) -->
            <g clip-path="url(#badge-clip)">
                <rect x="0" y="0" width="40" height="96" fill="url(#shimmer-grad)" class="shimmer-bar" />
            </g>

            <!-- Levitating 3D Emoji Icon & Glow -->
            <g transform="translate(30, 48)" class="levitate-icon">
                <circle cx="0" cy="0" r="22" fill="rgba(255,255,255,0.04)" stroke="#38BDF8" stroke-width="1" />
                <circle cx="0" cy="0" r="15" fill="#38BDF8" opacity="0.15" />
                <text x="0" y="7" font-size="20" text-anchor="middle">☁️</text>
            </g>
            
            <!-- Text Content -->
            <text x="65" y="42" font-size="12" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">AWS CLOUD ARCHITECT</text>
            <text x="65" y="60" font-size="10.5" font-weight="500" fill="#94A3B8">Serverless &amp; Cloud Infra</text>
            
            <!-- Verified Indicator Dot -->
            <circle cx="242" cy="16" r="3.5" fill="#38BDF8" class="badge-glow" />
        </g>

        <!-- 3D Holographic Card (PYTORCH &amp; LLMs) -->
        <g transform="translate(280, 0)">
            <!-- 3D Drop Shadow Pedestal -->
            <rect x="4" y="6" width="260" height="96" rx="14" fill="rgba(0,0,0,0.6)" />
            
            <!-- Card Body with Glassmorphic Gradient -->
            <rect x="0" y="0" width="260" height="96" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#818CF8" stroke-width="1.2" opacity="0.95" />
            
            <!-- Top Gradient Accent Strip -->
            <rect x="0" y="0" width="260" height="3" rx="1.5" fill="#818CF8" />
            
            <!-- Shimmer Light Sweep Effect (Clipped) -->
            <g clip-path="url(#badge-clip)">
                <rect x="0" y="0" width="40" height="96" fill="url(#shimmer-grad)" class="shimmer-bar" />
            </g>

            <!-- Levitating 3D Emoji Icon & Glow -->
            <g transform="translate(30, 48)" class="levitate-icon">
                <circle cx="0" cy="0" r="22" fill="rgba(255,255,255,0.04)" stroke="#818CF8" stroke-width="1" />
                <circle cx="0" cy="0" r="15" fill="#818CF8" opacity="0.15" />
                <text x="0" y="7" font-size="20" text-anchor="middle">🔥</text>
            </g>
            
            <!-- Text Content -->
            <text x="65" y="42" font-size="12" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">PYTORCH &amp; LLMs</text>
            <text x="65" y="60" font-size="10.5" font-weight="500" fill="#94A3B8">Deep Learning &amp; GenAI</text>
            
            <!-- Verified Indicator Dot -->
            <circle cx="242" cy="16" r="3.5" fill="#818CF8" class="badge-glow" />
        </g>

        <!-- 3D Holographic Card (DOCKER &amp; K8S EXPERT) -->
        <g transform="translate(560, 0)">
            <!-- 3D Drop Shadow Pedestal -->
            <rect x="4" y="6" width="260" height="96" rx="14" fill="rgba(0,0,0,0.6)" />
            
            <!-- Card Body with Glassmorphic Gradient -->
            <rect x="0" y="0" width="260" height="96" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#C084FC" stroke-width="1.2" opacity="0.95" />
            
            <!-- Top Gradient Accent Strip -->
            <rect x="0" y="0" width="260" height="3" rx="1.5" fill="#C084FC" />
            
            <!-- Shimmer Light Sweep Effect (Clipped) -->
            <g clip-path="url(#badge-clip)">
                <rect x="0" y="0" width="40" height="96" fill="url(#shimmer-grad)" class="shimmer-bar" />
            </g>

            <!-- Levitating 3D Emoji Icon & Glow -->
            <g transform="translate(30, 48)" class="levitate-icon">
                <circle cx="0" cy="0" r="22" fill="rgba(255,255,255,0.04)" stroke="#C084FC" stroke-width="1" />
                <circle cx="0" cy="0" r="15" fill="#C084FC" opacity="0.15" />
                <text x="0" y="7" font-size="20" text-anchor="middle">🐳</text>
            </g>
            
            <!-- Text Content -->
            <text x="65" y="42" font-size="12" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">DOCKER &amp; K8S EXPERT</text>
            <text x="65" y="60" font-size="10.5" font-weight="500" fill="#94A3B8">Containerized MLOps</text>
            
            <!-- Verified Indicator Dot -->
            <circle cx="242" cy="16" r="3.5" fill="#C084FC" class="badge-glow" />
        </g>

        <!-- 3D Holographic Card (TOP 5% CONTRIBUTOR) -->
        <g transform="translate(840, 0)">
            <!-- 3D Drop Shadow Pedestal -->
            <rect x="4" y="6" width="260" height="96" rx="14" fill="rgba(0,0,0,0.6)" />
            
            <!-- Card Body with Glassmorphic Gradient -->
            <rect x="0" y="0" width="260" height="96" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#34D399" stroke-width="1.2" opacity="0.95" />
            
            <!-- Top Gradient Accent Strip -->
            <rect x="0" y="0" width="260" height="3" rx="1.5" fill="#34D399" />
            
            <!-- Shimmer Light Sweep Effect (Clipped) -->
            <g clip-path="url(#badge-clip)">
                <rect x="0" y="0" width="40" height="96" fill="url(#shimmer-grad)" class="shimmer-bar" />
            </g>

            <!-- Levitating 3D Emoji Icon & Glow -->
            <g transform="translate(30, 48)" class="levitate-icon">
                <circle cx="0" cy="0" r="22" fill="rgba(255,255,255,0.04)" stroke="#34D399" stroke-width="1" />
                <circle cx="0" cy="0" r="15" fill="#34D399" opacity="0.15" />
                <text x="0" y="7" font-size="20" text-anchor="middle">🏆</text>
            </g>
            
            <!-- Text Content -->
            <text x="65" y="42" font-size="12" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">TOP 5% CONTRIBUTOR</text>
            <text x="65" y="60" font-size="10.5" font-weight="500" fill="#94A3B8">Open Source Architecture</text>
            
            <!-- Verified Indicator Dot -->
            <circle cx="242" cy="16" r="3.5" fill="#34D399" class="badge-glow" />
        </g>

    </g>
</svg>
